<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>LitVM Chess</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
            max-width: 780px;
            margin: 0 auto;
            padding: 30px 20px 120px 20px;
            background: linear-gradient(180deg, #0a0d14 0%, #0f1117 100%);
            color: #e6e6e6;
            min-height: 100vh;
        }
        h1 { color: #ffb84d; text-align: center; font-size: 28px; margin: 0 0 24px 0; }
        h3 { margin: 0 0 12px 0; font-size: 17px; color: #ffb84d; }
        .card {
            background: linear-gradient(180deg, #1a1d26 0%, #161922 100%);
            border-radius: 14px;
            padding: 20px;
            margin-bottom: 16px;
            border: 1px solid #2a2e3a;
        }
        button {
            background: linear-gradient(180deg, #ffc670 0%, #ffb84d 100%);
            color: #0f1117;
            font-weight: 600;
            cursor: pointer;
            border: none;
            padding: 11px 14px;
            border-radius: 9px;
            font-size: 15px;
        }
        button:disabled { background: #2a2e3a; color: #666; cursor: not-allowed; }
        .status { font-size: 13px; color: #8a92a6; margin-top: 8px; }
        #board { border: 4px solid #ffb84d; border-radius: 10px; margin: 0 auto; }
        
        /* Нижняя навигация */
        #bottomNav {
            position: fixed; left: 0; right: 0; bottom: 0; z-index: 9998;
            padding: 8px 10px calc(6px + env(safe-area-inset-bottom));
            background: rgba(22, 25, 34, 0.97);
            border-top: 1px solid #34343a;
            box-shadow: 0 -3px 14px rgba(0, 0, 0, 0.35);
        }
        #mainPlayBtn {
            display: block; width: 100%; max-width: 560px; min-height: 48px;
            margin: 0 auto 7px; border: 0; border-radius: 10px; color: #fff;
            font-size: 22px; font-weight: 800;
            background: linear-gradient(180deg, #8bc34a, #5d9f35);
        }
        #bottomNav .nav-icons { display: flex; width: 100%; justify-content: space-around; gap: 2px; }
        #bottomNav .nav-item {
            flex: 1; display: flex; flex-direction: column; align-items: center;
            gap: 2px; padding: 3px 0; border: 0; background: transparent;
            color: #aaa; font-size: 10px; cursor: pointer;
        }
        #bottomNav .nav-item.active { color: #fff; }
        #bottomNav .nav-icon { font-size: 21px; line-height: 1.1; }

        /* Экран новой игры */
        #newGameScreen {
            display: none; position: fixed; inset: 0; z-index: 10000;
            overflow: auto; padding: 20px; background: #292725;
            flex-direction: column;
        }
        #newGameHeader { display: flex; align-items: center; gap: 14px; margin-bottom: 32px; }
        #newGameBack { background: transparent; border: 0; color: #fff; font-size: 34px; cursor: pointer; }
        #newGameTitle { margin: 0; color: #fff; font-size: 27px; }
        #newGameTimeControl {
            width: 100%; min-height: 62px; margin-bottom: 14px; text-align: center;
            font-size: 20px; font-weight: 700; color: #fff; background: #393735;
            border: 1px solid #484542; border-radius: 12px;
        }
        #startNewGameBtn {
            width: 100%; min-height: 76px; margin-bottom: 26px; border: 0;
            border-radius: 12px; color: #fff; font-size: 24px; font-weight: 800;
            background: linear-gradient(180deg, #8bc34a, #5d9f35); cursor: pointer;
        }
        .new-game-option {
            width: 100%; min-height: 62px; margin-bottom: 10px; border: 1px solid #45423f;
            border-radius: 12px; color: #eee; background: #393735;
            font-size: 19px; font-weight: 700; cursor: pointer; text-align: left; padding: 0 20px;
        }
    </style>
</head>
<body>

    <div id="gameModeWrap">
        <h1>♟ LitVM Chess</h1>

        <div id="menuWrap">
            <!-- Профиль Telegram -->
            <div class="card" id="telegramProfileCard" style="display: none; align-items: center; gap: 12px;">
                <img id="tgProfileAvatar" src="" alt="" style="width: 48px; height: 48px; border-radius: 50%; object-fit: cover; background: #0f1117;">
                <div style="font-size: 16px; font-weight: 600; color: #e6e6e6;" id="tgProfileName"></div>
            </div>

            <!-- Статистика -->
            <div class="card">
                <h3>Your Stats</h3>
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px; font-size: 14px;">
                    <div>🎮 Games: <b id="statGames">-</b></div>
                    <div>🏆 Wins: <b id="statWins" style="color: #b6f7c4;">-</b></div>
                    <div>💀 Losses: <b id="statLosses" style="color: #f7b6b6;">-</b></div>
                    <div>🤝 Draws: <b id="statDraws" style="color: #ffd88a;">-</b></div>
                    <div style="grid-column: span 2;">📊 Win rate: <b id="statWinRate">-</b></div>
                </div>
            </div>

            <!-- История -->
            <div class="card">
                <h3>📜 Game History</h3>
                <div id="gameHistoryList" style="background: #0f1117; border: 1px solid #2a2e3a; border-radius: 8px; padding: 8px 10px; max-height: 400px; overflow-y: auto;">Loading...</div>
            </div>
        </div>

        <!-- Доска -->
        <div class="card" id="chessBoardCard" style="display: none;">
            <button id="backToMenuBtn" style="margin-bottom: 12px;">← Back</button>
            <div class="status" id="boardStatus" style="font-size: 15px; color: #ffb84d; font-weight: 600; margin-bottom: 12px;">No game selected.</div>
            <div style="display: flex; justify-content: space-around; margin: 10px 0;">
                <div>⚪ White: <span id="whiteTimer">--:--</span></div>
                <div>⚫ Black: <span id="blackTimer">--:--</span></div>
            </div>
            <div id="board" style="width: 400px; margin: 20px auto;"></div>
        </div>
    </div>

    <!-- Скрытые элементы для совместимости со скриптом -->
    <div id="opponentPanel" style="display: none;">
        <img id="opponentAvatar" src="" alt="">
        <div id="opponentName">—</div>
        <div id="opponentElo">—</div>
    </div>
    <div id="clockRow" style="display: none;"></div>
    <select id="onlineTimeControl" style="display: none;">
        <option value="60">1 min</option>
        <option value="300" selected>5 min</option>
        <option value="900">15 min</option>
        <option value="1800">30 min</option>
    </select>
    <div id="matchStatus"></div>
    <div id="botStatus"></div>
    <div id="moveHistoryList"></div>

    <!-- Новая навигация -->
    <div id="bottomNav">
        <button id="mainPlayBtn">Играть</button>
        <div class="nav-icons">
            <div class="nav-item active" onclick="switchTab('home')">
                <span class="nav-icon">🏠</span><span class="nav-label">Главная</span>
            </div>
            <div class="nav-item" onclick="switchTab('puzzles')">
                <span class="nav-icon">🧩</span><span class="nav-label">Задачи</span>
            </div>
            <div class="nav-item" onclick="switchTab('learn')">
                <span class="nav-icon">📚</span><span class="nav-label">Учеба</span>
            </div>
            <div class="nav-item" onclick="switchTab('watch')">
                <span class="nav-icon">👁️</span><span class="nav-label">Смотреть</span>
            </div>
            <div class="nav-item" onclick="switchTab('more')">
                <span class="nav-icon">☰</span><span class="nav-label">Еще</span>
            </div>
        </div>
    </div>

    <!-- Экран новой игры -->
    <div id="newGameScreen">
        <div id="newGameHeader">
            <button id="newGameBack">←</button>
            <h2 id="newGameTitle">Новая партия</h2>
        </div>
        <select id="newGameTimeControl">
            <option value="60">⏱️ 1 минута</option>
            <option value="300" selected>⏱️ 5 минут</option>
            <option value="900">⏱️ 15 минут</option>
            <option value="1800">⏱️ 30 минут</option>
        </select>
        <button id="startNewGameBtn">Начать партию</button>
        <button class="new-game-option" id="newGameTournaments">🏆 Турниры</button>
        <button class="new-game-option" id="newGameFriend">👥 Играть с другом</button>
        <button class="new-game-option" id="newGameBots">💻 Играть с ботами</button>
    </div>

    <!-- Библиотеки -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="jquery.min.js"></script>
    <script src="chessboard.min.js"></script>
    <script src="chess.min.js"></script>
    <script src="ethers.umd.min.js"></script>
    <script src="https://cdn.socket.io/4.6.1/socket.io.min.js"></script>

    <script>
        // ==== НАСТРОЙКИ ====
        const SOCKET_URL = "https://litvm-chess-server.onrender.com";
        const BOT_ADDRESS = "0xEb4eCf92738a4b3d82Fb143aDe9dD34Cf90D8B0e";
        const BOT_TIME_CONTROL = 300;

        let socket = null;
        let currentMatchId = null;
        let myColor = null;
        let pendingMove = false;
        let board = null;
        let game = new Chess();
        let selectedSquare = null;
        let legalMovesFromSelected = [];
        let pvpMoveHistory = [];
        let whiteTime = 0;
        let blackTime = 0;
        let timerInterval = null;
        let activeMatchId = null;

        // ==== НАВИГАЦИЯ ====
        const screen = document.getElementById("newGameScreen");
        const nav = document.getElementById("bottomNav");

        function openNewGameScreen() {
            screen.style.display = "flex";
            nav.style.display = "none";
        }
        function closeNewGameScreen() {
            screen.style.display = "none";
            nav.style.display = "block";
        }

        document.getElementById("mainPlayBtn").onclick = openNewGameScreen;
        document.getElementById("newGameBack").onclick = closeNewGameScreen;
        document.getElementById("startNewGameBtn").onclick = () => {
            const tc = parseInt(document.getElementById("newGameTimeControl").value, 10);
            document.getElementById("onlineTimeControl").value = tc;
            closeNewGameScreen();
            findMatch();
        };
        document.getElementById("newGameFriend").onclick = () => {
            closeNewGameScreen();
            inviteFriend();
        };
        document.getElementById("newGameBots").onclick = () => {
            closeNewGameScreen();
            startBotGame();
        };
        document.getElementById("newGameTournaments").onclick = () => {
            alert("Tournaments coming soon!");
        };

        function switchTab(tab) {
            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
            event.currentTarget.classList.add('active');
        }

        // ==== ПОДКЛЮЧЕНИЕ К СЕРВЕРУ ====
        function connectSocket() {
            if (socket && socket.connected) return;
            socket = io(SOCKET_URL, { transports: ["websocket", "polling"] });

            socket.on("connect", () => {
                console.log("✅ Socket connected");
                const savedToken = localStorage.getItem("resumeToken");
                const savedRoom = localStorage.getItem("roomId");
                if (savedToken && savedRoom) {
                    socket.emit("resumeGame", { roomId: savedRoom, resumeToken: savedToken });
                }
            });

            socket.on("matchFound", (data) => {
                if (data?.resumeToken && data?.roomId) {
                    localStorage.setItem("resumeToken", data.resumeToken);
                    localStorage.setItem("roomId", data.roomId);
                }
            });

            socket.on("gameState", (data) => {
                game.load(data.fen);
                board.position(data.fen, false);
            });

            socket.on("moveMade", (data) => {
                pendingMove = false;
                game.load(data.fen);
                board.position(data.fen, false);
                if (data.clocks) {
                    whiteTime = Math.floor(data.clocks.white / 1000);
                    blackTime = Math.floor(data.clocks.black / 1000);
                    updateClocks();
                }
            });

            socket.on("moveError", (data) => {
                pendingMove = false;
                board.position(game.fen(), false);
            });

            socket.on("opponentDisconnected", (data) => {
                document.getElementById("boardStatus").textContent = "⚠️ " + data.message;
            });
        }

        // ==== ИНИЦИАЛИЗАЦИЯ ДОСКИ ====
        function initBoard() {
            const touchOnly = window.matchMedia("(hover: none) and (pointer: coarse)").matches;
            board = Chessboard("board", {
                draggable: !touchOnly,
                position: "start",
                orientation: "white",
                onDragStart: onDragStart,
                onDrop: onDrop,
                pieceTheme: "https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png"
            });
            attachSquareClickHandlers();
            updateBoardStatus();
        }

        function onDragStart(source, piece) {
            if (game.game_over()) return false;
            if (pendingMove) return false;
            if (currentMatchId && myColor) {
                const myPrefix = myColor === "white" ? "^w" : "^b";
                if (piece.search(new RegExp(myPrefix)) === -1) return false;
            }
        }

        function onDrop(source, target) {
            if (socket && currentMatchId && myColor) {
                const probe = new Chess(game.fen());
                if (probe.move({ from: source, to: target, promotion: "q" }) === null) return "snapback";
                pendingMove = true;
                socket.emit("makeMove", { roomId: currentMatchId, from: source, to: target, promotion: "q" });
                return "snapback";
            }
            const move = game.move({ from: source, to: target, promotion: "q" });
            if (move === null) return "snapback";
            board.position(game.fen());
        }

        function attachSquareClickHandlers() {
            const boardEl = document.getElementById("board");
            if (!boardEl) return;
            boardEl.addEventListener("touchstart", (e) => {
                const touch = e.changedTouches[0];
                const els = document.elementsFromPoint(touch.clientX, touch.clientY);
                const sq = els.find(el => el.classList && el.classList.contains("square-55d63"));
                if (sq) {
                    e.preventDefault();
                    onSquareClick.call(sq);
                }
            }, { passive: false });
        }

        function onSquareClick() {
            if (pendingMove || game.game_over()) return;
            const square = this.getAttribute("data-square");
            if (!square) return;
            const piece = game.get(square);
            if (selectedSquare) {
                const legal = legalMovesFromSelected.find(m => m.to === square);
                if (legal) {
                    makeMove(selectedSquare, square);
                    clearHighlights();
                    selectedSquare = null;
                    legalMovesFromSelected = [];
                    return;
                }
            }
            clearHighlights();
            selectedSquare = null;
            legalMovesFromSelected = [];
            if (!piece) return;
            selectedSquare = square;
            legalMovesFromSelected = game.moves({ square: square, verbose: true });
            highlightSquare(square, "highlight-selected");
        }

        function clearHighlights() {
            document.querySelectorAll(".square-55d63").forEach(sq => sq.classList.remove("highlight-selected", "highlight-legal"));
        }

        function highlightSquare(square, className) {
            const el = document.querySelector('[data-square="' + square + '"]');
            if (el) el.classList.add(className);
        }

        function makeMove(from, to) {
            if (socket && currentMatchId && myColor) {
                const probe = new Chess(game.fen());
                if (probe.move({ from: from, to: to, promotion: "q" }) === null) return false;
                pendingMove = true;
                socket.emit("makeMove", { roomId: currentMatchId, from: from, to: to, promotion: "q" });
                return true;
            }
            const move = game.move({ from: from, to: to, promotion: "q" });
            if (move === null) return false;
            board.position(game.fen());
            return true;
        }

        // ==== ТАЙМЕР ====
        function updateClocks() {
            document.getElementById("whiteTimer").textContent = formatClock(whiteTime);
            document.getElementById("blackTimer").textContent = formatClock(blackTime);
        }
        function formatClock(seconds) {
            const m = Math.floor(seconds / 60);
            const s = seconds % 60;
            return m + ":" + (s < 10 ? "0" : "") + s;
        }

        // ==== ИГРА ====
        function findMatch() {
            if (!socket || !socket.connected) return alert("Not connected");
            const tc = parseInt(document.getElementById("onlineTimeControl").value, 10);
            const myAddress = window.tgSession?.chessAccount;
            if (!myAddress) return alert("Please login first");
            socket.emit("findMatch", {
                userAddress: myAddress,
                timeControl: tc,
                tgName: window.tgSession?.firstName || "Player",
                tgPhoto: window.tgSession?.photoUrl || null
            });
        }

        function inviteFriend() {
            if (!socket || !socket.connected) return alert("Not connected");
            const tc = parseInt(document.getElementById("onlineTimeControl").value, 10);
            const myAddress = window.tgSession?.chessAccount;
            if (!myAddress) return alert("Please login first");
            socket.emit("createPrivateRoom", {
                userAddress: myAddress,
                timeControl: tc,
                tgName: window.tgSession?.firstName || "Player",
                tgPhoto: window.tgSession?.photoUrl || null
            });
        }

        function startBotGame() {
            alert("Bot game started (local)");
            // Твой код для бота
        }

        // ==== ЗАПУСК ====
        window.addEventListener("load", () => {
            initBoard();
            connectSocket();
            document.getElementById("gameModeWrap").style.display = "block";
        });
    </script>

    <script src="telegram-auth.js?v=50"></script>
</body>
</html>
